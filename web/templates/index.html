<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Beach Hunt</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream:   #f5f0e8;
      --sand:    #e8ddc8;
      --bark:    #7a6a54;
      --dark:    #3a2e24;
      --accent:  #c8a96e;
      --blue:    #4a7fa5;
      --teal:    #3a8a7a;
      --coral:   #c06050;
      --gold:    #c8a060;
      --radius:  10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--dark);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--dark);
      color: var(--cream);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; letter-spacing: .5px; }
    .header-sub { font-size: .8rem; color: var(--sand); margin-left: auto; }
    .scrape-btn {
      background: var(--accent);
      color: var(--dark);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .scrape-btn:hover { background: #b8904e; }
    .secondary-btn {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(245,240,232,.45);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .secondary-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Main layout ── */
    main { display: flex; flex: 1; overflow: hidden; }

    /* ── Left panel ── */
    #left-panel {
      width: 300px;
      min-width: 260px;
      background: var(--sand);
      display: flex;
      flex-direction: column;
      border-right: 1px solid #d4c8b4;
      flex-shrink: 0;
    }
    .panel-controls {
      padding: 10px 12px;
      border-bottom: 1px solid #d4c8b4;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      padding: 4px 10px;
      border-radius: 14px;
      border: 1.5px solid var(--bark);
      background: transparent;
      color: var(--dark);
      font-size: .73rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active { background: var(--bark); color: var(--cream); }
    .price-filter { display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 2px; }
    .price-filter label { font-size: .72rem; color: var(--bark); white-space: nowrap; }
    .price-filter input { flex: 1; font-size: .75rem; border: 1px solid var(--bark); border-radius: 6px; padding: 3px 6px; background: var(--cream); }

    #cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card {
      background: var(--cream);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .card.active { border-color: var(--bark); box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    .card-name { font-weight: 600; font-size: .88rem; padding-right: 40px; }
    .card-area { font-size: .72rem; color: var(--bark); margin-top: 1px; }
    .card-meta { display: flex; gap: 8px; margin-top: 5px; align-items: center; flex-wrap: wrap; }
    .badge {
      font-size: .66rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .badge-apt   { background: #d0e4f0; color: #2a5a7a; }
    .badge-gym   { background: #d0eee8; color: #1a5a4a; }
    .badge-hosp  { background: #f0dcd8; color: #7a2a20; }
    .badge-poi   { background: #eadcf3; color: #5d3b75; }
    .badge-top   { background: var(--gold); color: #3a2800; }
    .card-rating { font-size: .75rem; color: var(--bark); }
    .card-price  { font-size: .72rem; color: var(--teal); font-weight: 600; margin-top: 3px; }
    .card-avail  { font-size: .68rem; color: var(--bark); }
    .card-top-icon { position: absolute; top: 8px; right: 10px; font-size: 1rem; }
    .decision-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: .66rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: .2px;
      background: #f3e7cd;
      color: #5f4417;
      border: 1px solid #e3ca94;
    }
    .decision-chip small { font-weight: 600; opacity: .82; }
    .detail-score-box {
      background: #fdf6e8;
      border: 1px solid #ead5af;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-score-title { font-size: .72rem; color: var(--bark); text-transform: uppercase; letter-spacing: .6px; }
    .detail-score-line { font-size: .82rem; }
    .detail-score-reasons { font-size: .75rem; color: var(--bark); margin-top: 1px; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Right detail panel ── */
    #detail-panel {
      width: 320px;
      min-width: 280px;
      background: var(--cream);
      border-left: 1px solid #d4c8b4;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    #detail-inner {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .detail-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--bark);
      font-size: .85rem;
      text-align: center;
      padding: 20px;
    }
    .detail-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .detail-address { font-size: .78rem; color: var(--bark); margin-bottom: 10px; }
    .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .detail-rating { font-size: .85rem; margin-bottom: 12px; }
    .detail-notes {
      font-size: .78rem;
      color: var(--bark);
      background: var(--sand);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .section-title {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--bark);
      margin: 12px 0 6px;
    }
    .unit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--sand);
      font-size: .78rem;
    }
    .unit-row:last-child { border-bottom: none; }
    .unit-size { font-weight: 600; }
    .unit-price { color: var(--teal); font-weight: 600; }
    .unit-avail { font-size: .68rem; }
    .unit-avail.yes { color: #2a7a4a; }
    .unit-avail.no  { color: #8a4040; }
    .proximity-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--sand);
      font-size: .77rem;
      cursor: pointer;
    }
    .proximity-item:hover .prox-name { text-decoration: underline; }
    .proximity-item:last-child { border-bottom: none; }
    .prox-name { color: var(--dark); }
    .prox-time { color: var(--bark); font-size: .72rem; }
    .detail-link {
      display: inline-block;
      margin-top: 12px;
      font-size: .75rem;
      color: var(--blue);
      text-decoration: none;
    }
    .detail-link:hover { text-decoration: underline; }
    .no-units { font-size: .75rem; color: var(--bark); font-style: italic; }


    /* Add location modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 8, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: min(640px, 92vw);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--cream);
      border-radius: 12px;
      border: 1px solid #d4c8b4;
      padding: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }
    .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; margin-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .field label { display:block; font-size:.72rem; color:var(--bark); margin-bottom:3px; }
    .field input, .field select, .field textarea { width:100%; border:1px solid #ccbca3; background:#fff; border-radius:8px; padding:7px 8px; font-size:.82rem; }
    .field textarea { min-height:70px; resize: vertical; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top: 12px; }
    .primary-btn { background: var(--bark); color: var(--cream); border: none; border-radius: 8px; padding: 8px 14px; font-weight:600; cursor:pointer; }
    .ghost-btn { background: transparent; color: var(--bark); border: 1px solid #c8b89d; border-radius: 8px; padding: 8px 14px; cursor:pointer; }
    .form-note { font-size:.72rem; color: var(--bark); margin-top: 8px; }
    .inline-row { display:flex; gap:8px; align-items:flex-end; }
    .inline-row .field { flex:1; }
    .tiny-btn { background:#fff; border:1px solid #c8b89d; border-radius:8px; padding:7px 10px; font-size:.75rem; cursor:pointer; }
    .tiny-btn:hover { border-color: var(--bark); color: var(--bark); }
    .hidden { display: none; }

    /* Changes bar */
    #changes-bar {
      background: #fff8ec;
      border-top: 1px solid #e8d8b0;
      padding: 6px 12px;
      font-size: .72rem;
      color: var(--bark);
      flex-shrink: 0;
      max-height: 60px;
      overflow-y: auto;
    }
    #changes-bar span { font-weight: 600; color: var(--dark); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--sand); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h1>🌴 Palm Beach Hunt</h1>
  <div class="header-sub" id="header-status">Loading…</div>
  <button class="secondary-btn" onclick="openAddModal()">＋ Add Location</button>
  <button class="scrape-btn" onclick="triggerScrape()">⟳ Refresh Data</button>
</header>

<main>
  <!-- Left: card list -->
  <div id="left-panel">
    <div class="panel-controls">
      <button class="filter-btn active" data-type="all" onclick="setFilter(this,'all')">All</button>
      <button class="filter-btn" data-type="apartment" onclick="setFilter(this,'apartment')">Apartments</button>
      <button class="filter-btn" data-type="gym" onclick="setFilter(this,'gym')">Gyms</button>
      <button class="filter-btn" data-type="hospital" onclick="setFilter(this,'hospital')">Hospitals</button>
      <button class="filter-btn" data-type="poi" onclick="setFilter(this,'poi')">POIs</button>
      <button class="filter-btn" data-type="top" onclick="setFilter(this,'top')">Top Picks</button>
      <button class="filter-btn" data-type="available" onclick="setFilter(this,'available')">Available Now</button>
      <div class="price-filter">
        <label>Max $/mo:</label>
        <input type="number" id="max-price-input" placeholder="3500" min="1000" max="10000" step="100"
               onchange="applyFilters()" />
      </div>
    </div>
    <div id="cards-list"></div>
  </div>

  <!-- Center: map -->
  <div id="map"></div>

  <!-- Right: detail panel -->
  <div id="detail-panel">
    <div id="detail-inner">
      <div class="detail-empty">Click a card or map marker to see details.</div>
    </div>
    <div id="changes-bar">Loading recent changes…</div>
  </div>
</main>


<div id="add-modal" class="modal-overlay" onclick="closeAddModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-title">Add Location</div>
    <form id="add-location-form" onsubmit="submitAddLocation(event)">
      <div class="form-grid">
        <div class="field full">
          <label>Paste URL (Google Maps, apartments.com, property site)</label>
          <div class="inline-row">
            <div class="field"><input name="source_url" id="source-url-input" placeholder="https://maps.google.com/... or https://www.apartments.com/..." /></div>
            <button type="button" class="tiny-btn" onclick="autofillFromUrl()">Auto-fill</button>
          </div>
        </div>
        <div class="field"><label>Name *</label><input required name="name" /></div>
        <div class="field"><label>Type *</label>
          <select required name="location_type" onchange="toggleTypeFields()" id="location-type-select">
            <option value="apartment">Apartment</option>
            <option value="gym">Gym</option>
            <option value="hospital">Hospital</option>
            <option value="poi">Point of Interest</option>
          </select>
        </div>
        <div class="field full"><label>Address *</label><input required name="address" /></div>
        <div class="field"><label>Latitude *</label><input required type="number" step="any" name="lat" /></div>
        <div class="field"><label>Longitude *</label><input required type="number" step="any" name="lon" /></div>
        <div class="field"><label>Website</label><input name="website_url" /></div>
        <div class="field"><label>Phone</label><input name="phone" /></div>
        <div class="field full"><label>Notes</label><textarea name="notes"></textarea></div>
        <div class="field"><label><input type="checkbox" name="is_top_pick" /> Top pick</label></div>

        <div class="field full type-apartment"><label>Apartments.com slug</label><input name="apartments_com_slug" /></div>

        <div class="field type-gym type-hospital"><label>Google Place ID</label><input name="google_place_id" /></div>
        <div class="field type-gym type-hospital"><label>Hours</label><input name="hours" /></div>
        <div class="field full type-gym"><label>Equipment highlights (| separated)</label><input name="equipment_highlights_text" placeholder="Power racks | 24/7 access" /></div>
        <div class="field full type-hospital"><label>Health system</label><input name="health_system" /></div>

        <div class="field full type-poi"><label>POI Category</label><input name="category" placeholder="e.g., grocery, coworking, park" /></div>
      </div>
      <div class="form-note">Tip: for quick capture, only name/address/coordinates/type are required.</div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" onclick="closeAddModal()">Cancel</button>
        <button type="submit" class="primary-btn" id="add-submit-btn">Save location</button>
      </div>
    </form>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────────────
let allLocations = [];
let markers = {};
let activeId = null;
let currentFilter = 'all';
let map;

// ── Map init ────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map').setView([26.49, -80.07], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    maxZoom: 18,
  }).addTo(map);
}

// ── Marker colors ───────────────────────────────────────────────────────────
const TYPE_COLOR = { apartment: '#4a7fa5', gym: '#3a8a7a', hospital: '#c06050', poi: '#8a5ca5' };
const BADGE_CLASS = { apartment: 'badge-apt', gym: 'badge-gym', hospital: 'badge-hosp', poi: 'badge-poi' };
const TYPE_LABEL = { apartment: 'Apartment', gym: 'Gym', hospital: 'Hospital', poi: 'POI' };

function makeIcon(loc) {
  const color = TYPE_COLOR[loc.location_type] || '#888';
  const border = loc.is_top_pick ? '#c8a060' : '#fff';
  const bw = loc.is_top_pick ? 3 : 2;
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:${bw}px solid ${border};box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
}

// ── Load data ────────────────────────────────────────────────────────────────
async function loadLocations() {
  const res = await fetch('/api/locations');
  allLocations = await res.json();
  renderAll();
  document.getElementById('header-status').textContent =
    `${allLocations.length} locations · ${new Date().toLocaleTimeString()}`;
}

async function loadChanges() {
  const res = await fetch('/api/changes?since_hours=24');
  const changes = await res.json();
  const bar = document.getElementById('changes-bar');
  if (!changes.length) {
    bar.textContent = 'No changes in the last 24 hours.';
    return;
  }
  bar.innerHTML = '<span>Recent changes: </span>' +
    changes.slice(0, 5).map(c =>
      `${c.location_name} · ${c.field}: ${c.old_value || '–'} → <span>${c.new_value || '–'}</span>`
    ).join('  |  ');
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  renderCards();
  renderMarkers();
}

function getFilteredLocations() {
  const maxPrice = parseInt(document.getElementById('max-price-input').value) || Infinity;
  return allLocations.filter(loc => {
    if (currentFilter === 'top' && !loc.is_top_pick) return false;
    if (currentFilter === 'available') {
      if (loc.location_type !== 'apartment') return true;
      return (loc.available_count || 0) > 0;
    }
    if (currentFilter !== 'all' && currentFilter !== 'top' && currentFilter !== 'available') {
      if (loc.location_type !== currentFilter) return false;
    }
    if (loc.location_type === 'apartment' && loc.units && loc.units.length > 0) {
      const prices = loc.units.filter(u => u.price_min).map(u => u.price_min);
      if (prices.length && Math.min(...prices) > maxPrice) return false;
    }
    return true;
  }).sort((a, b) => {
    const as = a.decision_insight?.score ?? -1;
    const bs = b.decision_insight?.score ?? -1;
    if (bs !== as) return bs - as;
    return a.name.localeCompare(b.name);
  });
}

function renderCards() {
  const list = document.getElementById('cards-list');
  const locs = getFilteredLocations();
  list.innerHTML = '';
  locs.forEach(loc => {
    const card = document.createElement('div');
    card.className = 'card' + (loc.id === activeId ? ' active' : '');
    card.dataset.id = loc.id;
    card.onclick = () => selectLocation(loc.id);

    const priceHtml = loc.location_type === 'apartment'
      ? `<div class="card-price">${loc.price_range || '<span style="color:var(--bark);font-weight:400">not yet scraped</span>'}</div>
         ${loc.available_count != null ? `<div class="card-avail">${loc.available_count} unit${loc.available_count !== 1 ? 's' : ''} available</div>` : ''}`
      : '';

    const decisionHtml = loc.decision_insight
      ? `<span class="decision-chip">Score ${loc.decision_insight.score}<small>${loc.decision_insight.summary}</small></span>`
      : '';

    card.innerHTML = `
      ${loc.is_top_pick ? '<div class="card-top-icon">⭐</div>' : ''}
      <div class="card-name">${loc.name}</div>
      <div class="card-area">${areaFromAddress(loc.address)}</div>
      <div class="card-meta">
        <span class="badge ${BADGE_CLASS[loc.location_type]}">${TYPE_LABEL[loc.location_type]}</span>
        ${loc.is_top_pick ? '<span class="badge badge-top">TOP PICK</span>' : ''}
        ${decisionHtml}
        <span class="card-rating">${loc.rating ? '⭐ ' + loc.rating.toFixed(1) : ''}</span>
      </div>
      ${priceHtml}
    `;
    list.appendChild(card);
  });
}

function renderMarkers() {
  // Clear old markers
  Object.values(markers).forEach(m => m.remove());
  markers = {};

  allLocations.forEach(loc => {
    if (!loc.lat || !loc.lon) return;
    const m = L.marker([loc.lat, loc.lon], { icon: makeIcon(loc) }).addTo(map);
    m.bindTooltip(loc.name, { permanent: false, direction: 'top', offset: [0, -8] });
    m.on('click', () => selectLocation(loc.id));
    markers[loc.id] = m;
  });
}

// ── Selection ────────────────────────────────────────────────────────────────
function selectLocation(id) {
  activeId = id;
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.id) === id);
  });
  const loc = allLocations.find(l => l.id === id);
  if (loc) {
    renderDetail(loc);
    if (markers[id]) map.panTo([loc.lat, loc.lon]);
  }
}

function renderDetail(loc) {
  const panel = document.getElementById('detail-inner');
  const units = loc.units || [];
  const scraped = loc.last_scraped ? new Date(loc.last_scraped + 'Z').toLocaleString() : null;
  const decision = loc.decision_insight;

  // Proximity: show nearest of other types
  const proximityHtml = buildProximity(loc);

  // Units table
  let unitsHtml = '';
  if (loc.location_type === 'apartment') {
    if (!units.length) {
      unitsHtml = `<div class="section-title">Floor Plans / Availability</div>
                   <p class="no-units">No data yet — run <code>hunt scrape</code> to fetch live availability.</p>`;
    } else {
      unitsHtml = `<div class="section-title">Floor Plans / Availability</div>` +
        units.map(u => `
          <div class="unit-row">
            <span class="unit-size">${u.size_display}</span>
            <span class="unit-price">${u.price_display}</span>
            <span class="unit-avail ${u.available ? 'yes' : 'no'}">${u.available ? '● Available' : '○ Unavail.'}</span>
          </div>`).join('');
    }
  }

  panel.innerHTML = `
    <div class="detail-name">${loc.name}</div>
    <div class="detail-address">${loc.address}</div>
    ${decision ? `<div class="detail-score-box">
      <div class="detail-score-title">Decision Score · ${decision.version}</div>
      <div class="detail-score-line"><strong>${decision.score}</strong>/100 · ${decision.summary}</div>
      ${decision.reasons?.length ? `<div class="detail-score-reasons">${decision.reasons.join(' · ')}</div>` : ''}
    </div>` : ''}
    <div class="detail-badges">
      <span class="badge ${BADGE_CLASS[loc.location_type]}">${TYPE_LABEL[loc.location_type]}</span>
      ${loc.is_top_pick ? '<span class="badge badge-top">TOP PICK</span>' : ''}
    </div>
    <div class="detail-rating">
      ${loc.rating ? `⭐ <strong>${loc.rating.toFixed(1)}</strong>` : ''}
      ${loc.review_count ? ` · ${loc.review_count.toLocaleString()} reviews` : ''}
    </div>
    ${loc.notes ? `<div class="detail-notes">${loc.notes}</div>` : ''}
    ${unitsHtml}
    ${proximityHtml}
    ${loc.website_url ? `<a class="detail-link" href="${loc.website_url}" target="_blank" rel="noopener">↗ Visit website</a>` : ''}
    ${loc.phone ? `<div style="font-size:.75rem;margin-top:6px;color:var(--bark)">📞 ${loc.phone}</div>` : ''}
    ${scraped ? `<div style="font-size:.68rem;margin-top:10px;color:#aaa">Last scraped: ${scraped}</div>` : ''}
  `;
}

function buildProximity(loc) {
  const others = allLocations.filter(l => l.id !== loc.id && l.lat && l.lon);
  // For apartments: show nearest gym + hospital
  // For gyms/hospitals: show nearest apartments
  let relevant = [];
  if (loc.location_type === 'apartment') {
    const gyms = others.filter(l => l.location_type === 'gym');
    const hosps = others.filter(l => l.location_type === 'hospital');
    relevant = [
      ...nearestN(loc, gyms, 2),
      ...nearestN(loc, hosps, 2),
    ];
  } else {
    relevant = nearestN(loc, others.filter(l => l.location_type === 'apartment'), 3);
  }
  if (!relevant.length) return '';
  return `<div class="section-title">Proximity</div>` +
    relevant.map(({ other, mins }) => `
      <div class="proximity-item" onclick="selectLocation(${other.id})">
        <span class="prox-name">${other.name}</span>
        <span class="prox-time">~${mins} min drive</span>
      </div>`).join('');
}

function nearestN(from, candidates, n) {
  return candidates
    .map(other => ({ other, mins: driveMins(from, other) }))
    .sort((a, b) => a.mins - b.mins)
    .slice(0, n);
}

function driveMins(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  const km = R * 2 * Math.asin(Math.sqrt(x));
  return Math.round(km * 0.621371 / 24 * 60);
}

// ── Scrape trigger ────────────────────────────────────────────────────────────
async function triggerScrape() {
  const btn = document.querySelector('.scrape-btn');
  btn.textContent = '⟳ Scraping…';
  btn.disabled = true;
  try {
    // Call the scrape endpoint (runs in background on server)
    await fetch('/api/scrape', { method: 'POST' });
    await loadLocations();
    await loadChanges();
  } catch (e) {
    alert('Scrape failed — check the terminal for errors.');
  } finally {
    btn.textContent = '⟳ Refresh Data';
    btn.disabled = false;
  }
}

// ── Add location modal ──────────────────────────────────────────────────────
function openAddModal() {
  document.getElementById('add-modal').classList.add('open');
  toggleTypeFields();
}

function closeAddModal(event) {
  if (!event || event.target.id === 'add-modal') {
    document.getElementById('add-modal').classList.remove('open');
  }
}

function toggleTypeFields() {
  const type = document.getElementById('location-type-select').value;
  document.querySelectorAll('.type-apartment,.type-gym,.type-hospital,.type-poi').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll(`.type-${type}`).forEach(el => el.classList.remove('hidden'));
}

async function submitAddLocation(event) {
  event.preventDefault();
  const form = document.getElementById('add-location-form');
  const btn = document.getElementById('add-submit-btn');
  const f = new FormData(form);
  const payload = {
    name: String(f.get('name') || '').trim(),
    address: String(f.get('address') || '').trim(),
    lat: Number(f.get('lat')),
    lon: Number(f.get('lon')),
    location_type: String(f.get('location_type') || ''),
    website_url: String(f.get('website_url') || '').trim() || null,
    phone: String(f.get('phone') || '').trim() || null,
    notes: String(f.get('notes') || '').trim() || null,
    is_top_pick: f.get('is_top_pick') === 'on',
    apartments_com_slug: String(f.get('apartments_com_slug') || '').trim() || null,
    google_place_id: String(f.get('google_place_id') || '').trim() || null,
    hours: String(f.get('hours') || '').trim() || null,
    equipment_highlights: String(f.get('equipment_highlights_text') || '').split('|').map(s => s.trim()).filter(Boolean),
    health_system: String(f.get('health_system') || '').trim() || null,
    category: String(f.get('category') || '').trim() || null,
  };

  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/locations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'Failed to save location');
    }
    form.reset();
    closeAddModal();
    await loadLocations();
    const created = await res.json();
    if (created?.id) selectLocation(created.id);
  } catch (e) {
    alert(`Could not save location: ${e.message || e}`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save location';
  }
}

async function autofillFromUrl() {
  const input = document.getElementById('source-url-input');
  const url = (input.value || '').trim();
  if (!url) {
    alert('Paste a URL first.');
    return;
  }
  try {
    const res = await fetch('/api/locations/enrich-from-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Could not parse URL');

    const form = document.getElementById('add-location-form');
    if (data.inferred_type) form.elements['location_type'].value = data.inferred_type;
    if (data.suggested_name && !form.elements['name'].value.trim()) form.elements['name'].value = data.suggested_name;
    if (typeof data.lat === 'number') form.elements['lat'].value = data.lat;
    if (typeof data.lon === 'number') form.elements['lon'].value = data.lon;
    if (data.website_url) form.elements['website_url'].value = data.website_url;
    if (data.apartments_com_slug) form.elements['apartments_com_slug'].value = data.apartments_com_slug;
    if (data.google_place_id) form.elements['google_place_id'].value = data.google_place_id;
    toggleTypeFields();
  } catch (e) {
    alert(`URL auto-fill failed: ${e.message || e}`);
  }
}

function areaFromAddress(addr) {
  const parts = addr.split(',');
  return parts.length >= 2 ? parts[1].trim() : addr;
}
